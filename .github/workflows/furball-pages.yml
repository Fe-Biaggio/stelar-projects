# Publica o site no GitHub Pages:
#   Furball   → https://fe-biaggio.github.io/stelar-projects/
#   Lotofácil → https://fe-biaggio.github.io/stelar-projects/lotofacil/
# Roda a cada push no main que mexa nos projetos e duas vezes por dia para buscar
# os resultados novos da Lotofácil na Caixa (o commit dos resultados é feito aqui mesmo).
name: Site no GitHub Pages

on:
  push:
    branches: [main]
    paths: ['Furball/**', 'Lotofacil/**', '.github/workflows/furball-pages.yml']
  schedule:
    - cron: '30 1 * * *'   # 22h30 em Brasília, depois do sorteio
    - cron: '0 12 * * *'   # 9h em Brasília, caso o resultado tenha atrasado
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lotofácil – buscar resultados novos
        run: python Lotofacil/tools/atualizar_resultados.py
      - name: Lotofácil – salvar resultados no repositório
        run: |
          if [ -n "$(git status --porcelain Lotofacil/app/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Lotofacil/app/data
            git commit -m "Lotofácil: resultados atualizados"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Furball/package-lock.json
      - name: Furball – build
        working-directory: Furball
        run: npm ci && npm run build
      - name: Juntar os dois projetos
        run: cp -r Lotofacil/app Furball/dist/lotofacil
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Furball/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
