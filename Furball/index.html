<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Furball</title>
    <style>
      :root { --bg: #0d0b0a; --fg: #e8d9c4; color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100%; height: 100%; }
      /* Celular em pé: pede para girar */
      #rotate { display: none; position: fixed; inset: 0; background: var(--bg); color: var(--fg);
        font: 18px/1.4 monospace; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Gire o celular para jogar na horizontal ↻</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
